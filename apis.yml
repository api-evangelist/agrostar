aid: agrostar
name: Agrostar
description: >-
  AgroStar (Ulink Agritech Private Ltd) is a leading Indian agri-tech company on a
  mission to help farmers grow more and earn more, sustainably. Founded in Pune, it
  operates India's largest digital farmer network and agri-inputs platform, serving
  millions of farmers across Gujarat, Rajasthan, Maharashtra, Madhya Pradesh and
  Uttar Pradesh through its Kisan (AgriDoctor) mobile app. AgroStar builds a connected
  ecosystem across the agricultural value chain — farm advisory, quality agri-inputs,
  omnichannel retail access and global market linkages — backed by data and agronomy
  expertise, with a focus on climate-smart agriculture, water conservation and reducing
  food waste. It is a portfolio company of Accel. AgroStar's public corporate site is
  Wix-powered and exposes a hosted Model Context Protocol (MCP) endpoint plus an
  /llms.txt for agentic AI access to public site content; it does not publish a
  developer-facing product API.
